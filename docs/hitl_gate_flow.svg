<svg width="680" height="410" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HITL 승인 게이트 흐름도</title>
<desc>gate 노드가 interrupt로 멈춰 담당자의 결정을 기다리고, 담당자가 결정을 전달하면 gate가 그 값에 따라 execute(승인 또는 수정후승인일 때, 보고서 저장) 또는 reject(반려 또는 다시판정일 때, 저장 안 함)로 이어지며, 체크포인터가 gate의 실행 상태를 저장·복원하는 흐름을 보여준다.</desc>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#1a1a1a}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;fill:#555}
.box{fill:#ffffff;stroke:#888;stroke-width:0.5}
.gate{fill:#fbe9e7;stroke:#c0392b;stroke-width:0.75}
.gate .t{fill:#8e2a1f}
.gate .s{fill:#a8443a}
line{stroke:#555;stroke-width:1.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="160" y1="200" x2="224" y2="200" marker-end="url(#arrow)"/>

<line x1="270" y1="160" x2="270" y2="106" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="265" y="133" text-anchor="end" class="s">interrupt(즉시)</text>

<line x1="340" y1="100" x2="340" y2="154" marker-end="url(#arrow)"/>
<text x="345" y="133" text-anchor="start" class="s">담당자 결정 전달</text>

<line x1="380" y1="200" x2="494" y2="160" marker-end="url(#arrow)"/>
<text x="437" y="177" text-anchor="middle" class="s">승인 · 수정후승인</text>

<line x1="380" y1="230" x2="494" y2="315" marker-end="url(#arrow)"/>
<text x="437" y="266" text-anchor="middle" class="s">반려 · 다시판정</text>
<text x="437" y="282" text-anchor="middle" class="s">(수동 재실행)</text>

<line x1="270" y1="240" x2="270" y2="294" marker-end="url(#arrow)"/>
<text x="245" y="270" text-anchor="end" class="s">저장</text>

<line x1="340" y1="300" x2="340" y2="246" marker-end="url(#arrow)"/>
<text x="365" y="270" text-anchor="start" class="s">복원</text>

<g><rect class="box" x="40" y="170" width="120" height="60" rx="4"/>
<text x="100" y="205" text-anchor="middle" class="t">환불 요청</text></g>

<g class="gate"><rect x="230" y="160" width="150" height="80" rx="4"/>
<text x="305" y="192" text-anchor="middle" class="t">gate (⑦ 발행)</text>
<text x="305" y="212" text-anchor="middle" class="s">사람 승인 대기</text></g>

<g><rect class="box" x="265" y="40" width="140" height="60" rx="4"/>
<text x="335" y="66" text-anchor="middle" class="t">담당자</text>
<text x="335" y="84" text-anchor="middle" class="s">확인 후 결정</text></g>

<g><rect class="box" x="500" y="130" width="130" height="60" rx="4"/>
<text x="565" y="156" text-anchor="middle" class="t">execute</text>
<text x="565" y="174" text-anchor="middle" class="s">보고서 저장</text></g>

<g><rect class="box" x="500" y="280" width="130" height="70" rx="4"/>
<text x="565" y="310" text-anchor="middle" class="t">reject</text>
<text x="565" y="330" text-anchor="middle" class="s">저장 안 함</text></g>

<g><rect class="box" x="230" y="300" width="160" height="70" rx="4"/>
<text x="310" y="330" text-anchor="middle" class="t">체크포인터</text>
<text x="310" y="350" text-anchor="middle" class="s">실행 상태 저장</text></g>
</svg>
